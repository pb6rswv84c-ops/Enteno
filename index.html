<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">

<meta name="mobile-web-app-capable" content="yes">

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}body{margin:0}[hidden]{display:none!important}button{-webkit-tap-highlight-color:transparent}</style>
</head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: una columna de app móvil — pestañas de ejercicio, tarjeta "hoy" con series tocables, rejilla de días */
:root{
  --bg:#EEF1F0; --surface:#FFFFFF; --ink:#16201E; --muted:#5E6B68; --line:#D6DDDB;
  --accent:#0B7A5F; --accent-soft:#D5EDE5; --on-accent:#FFFFFF;
  --test:#B66A00; --test-soft:#F7E6CC;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1514; --surface:#18211F; --ink:#E7EEEC; --muted:#93A29E; --line:#2A3633;
  --accent:#35C79C; --accent-soft:#163B31; --on-accent:#06231B;
  --test:#F0A63A; --test-soft:#3A2A12; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1514; --surface:#18211F; --ink:#E7EEEC; --muted:#93A29E; --line:#2A3633;
  --accent:#35C79C; --accent-soft:#163B31; --on-accent:#06231B;
  --test:#F0A63A; --test-soft:#3A2A12; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
.wrap{max-width:560px;margin:0 auto;padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
h1{font-family:var(--display);font-weight:700;font-size:30px;letter-spacing:.01em;margin:0;text-transform:uppercase;line-height:1}
.sub{color:var(--muted);font-size:14px;margin:4px 0 0}
.lbl{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tab{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:2px}
.tab b{font-family:var(--display);font-size:18px;font-weight:600;text-transform:uppercase;line-height:1}
.tab span{font-size:11px;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tab[aria-selected="true"] span{color:var(--bg);opacity:.75}

.levels{display:flex;gap:6px}
.lv{flex:1;border:1px solid var(--line);background:transparent;border-radius:8px;padding:8px 6px;text-align:left}
.lv b{display:block;font-family:var(--display);font-size:17px;font-weight:600}
.lv small{color:var(--muted);font-size:12px}
.lv .bar{height:4px;border-radius:2px;background:var(--line);margin-top:6px;overflow:hidden}
.lv .bar i{display:block;height:100%;background:var(--accent)}
.lv[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}

.today{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 16px;display:flex;flex-direction:column;gap:16px}
.today.is-test{border-color:var(--test)}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.day{font-family:var(--display);font-size:46px;font-weight:700;line-height:.9}
.day small{font-size:20px;color:var(--muted);font-weight:500}
.total{text-align:right}
.total b{font-family:var(--display);font-size:34px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.pill{display:inline-block;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;padding:3px 8px;border-radius:99px;background:var(--test-soft);color:var(--test)}
.pill.ok{background:var(--accent-soft);color:var(--accent)}
.sets{display:flex;flex-wrap:wrap;gap:10px}
.set{width:62px;height:62px;border-radius:50%;border:2px solid var(--line);background:transparent;font-family:var(--display);font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;display:grid;place-items:center;transition:background .15s,border-color .15s}
.set.next{border-color:var(--accent)}
.set.done{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.hint{font-size:14px;color:var(--muted);margin:0}

.timer{display:flex;align-items:center;gap:12px;background:var(--accent-soft);border-radius:10px;padding:10px 12px}
.timer b{font-family:var(--display);font-size:32px;font-weight:700;font-variant-numeric:tabular-nums;min-width:70px}
.timer .grow{flex:1;font-size:14px}
.ghost{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-size:14px;font-weight:500}
.primary{border:0;background:var(--accent);color:var(--on-accent);border-radius:10px;padding:13px 16px;font-weight:600;font-size:16px;width:100%}
.primary.test{background:var(--test);color:#fff}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rest{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.rest button{border:1px solid var(--line);background:transparent;border-radius:99px;padding:4px 10px;font-size:13px;font-variant-numeric:tabular-nums}
.rest button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.maxin{display:flex;gap:8px}
.maxin input{flex:1;min-width:0;font:600 24px var(--display);padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}
.d{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:1px;position:relative}
.d b{font-family:var(--display);font-size:18px;font-weight:600;line-height:1.1}
.d span{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.d.done{background:var(--accent-soft);border-color:transparent}
.d.done b{color:var(--accent)}
.d.tst{border-style:dashed;border-color:var(--test)}
.d[aria-current="true"]{outline:2px solid var(--ink);outline-offset:-1px}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.confirm{display:flex;gap:8px;align-items:center;font-size:14px}
.danger{border:1px solid var(--test);color:var(--test);background:transparent;border-radius:8px;padding:6px 10px;font-size:14px}

.week{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wd{border:1px solid var(--line);background:transparent;border-radius:8px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.wd b{font-family:var(--display);font-size:17px;font-weight:700;line-height:1}
.wd span{font-size:10px;color:var(--muted);line-height:1.15;text-align:center}
.wd.today b{color:var(--accent)}
.wd.today{border-color:var(--accent)}
.wd[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.wd[aria-pressed="true"] span,.wd[aria-pressed="true"] b{color:var(--bg)}
.wd.off span{opacity:.6}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pe{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0}
.pe b{font-family:var(--display);font-size:20px;font-weight:600;text-transform:uppercase;line-height:1.05}
.pe small{color:var(--muted);font-size:12px}
.pe .n{font-family:var(--display);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.pe.ok{background:var(--accent-soft);border-color:transparent}
.pe.ok .n{color:var(--accent)}
.pe[aria-current="true"]{outline:2px solid var(--ink);outline-offset:-1px}
.sch{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.sch button{border:1px solid var(--line);background:transparent;border-radius:99px;padding:4px 10px;font-size:13px}
.sch button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.tab .hoy{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--accent)}
.tab[aria-selected="true"] .hoy{color:var(--bg)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header>
    <h1>Plan de entrenamiento</h1>
    <p class="sub">Toca cada serie al terminarla. Tu progreso se guarda en este dispositivo.</p>
  </header>
  <section class="week" id="week"></section>
  <nav class="tabs" role="tablist" id="tabs"></nav>
  <div class="levels" id="levels"></div>
  <section class="today" id="today"></section>
  <section>
    <div class="foot" style="margin-bottom:8px"><span class="lbl" id="gridLbl">Días</span><span class="lbl" id="gridSum"></span></div>
    <div class="grid" id="grid"></div>
  </section>
  <div class="foot">
    <div class="rest" id="rest"></div>
    <div id="resetBox"></div>
  </div>
</div>

<script>
const EX=[
 {id:"push",name:"Flexiones",en:"Push-ups",L:[
  "2-3-4-3-2,3-4-4-3-2,4-4-3-5-4,5-6-6-4-4,7-6-6-5-3,8-8-6-7-6,10-6-10-8-6,12-8-8-10-8,14-10-14-8-8,20",
  "16-12-14-10-10,16-16-12-11-10,18-16-12-12-10,20-16-14-12-12,22-12-18-12-12,24-20-16-12-8,26-20-14-12-10,28-22-14-12-10,28-22-14-12-12,30-20-20-10-10,32-20-18-10-12,32-22-18-14-10,34-18-20-16-12,34-20-18-16-12,36-22-16-16-14,38-24-18-14-12,38-22-16-20-12,40-18-24-16-16,50",
  "34-24-22-20-18,36-26-22-22-14,38-26-22-22-14,40-26-24-18-16,40-28-24-18-16,42-24-22-22-18,46-26-24-20-16,46-26-24-20-18,48-26-26-20-16,50-28-24-20-18,50-26-26-22-18,52-26-26-22-18,54-28-24-22-18,56-28-24-22-18,58-28-24-22-18,60-26-24-24-20,62-30-24-22-18,64-30-24-20-20,66-30-24-22-20,68-30-24-22-20,70-32-24-22-18,74-32-28-18-18,76-32-24-20-20,78-32-26-20-18,100"]},
 {id:"pull",name:"Dominadas",en:"Pull-ups",L:[
  "1-1-1-1,1-2-2-1,2-2-1-2,2-2-2-2,2-3-3-2,3-3-2-2,3-3-3-2,4-3-2-2,4-3-3-2,4-4-3-2,4-4-3-3,4-4-4-3,5-4-4-3,5-5-4-3,5-5-5-3,6-5-4-4,6-6-4-4,7-5-5-4,10",
  "6-4-3-4,6-4-3-4,8-5-3-4,8-5-4-4,9-6-4-4,9-6-4-4,10-6-4-6,10-8-6-6,12-8-6-6,12-8-6-6,13-10-6-6,13-10-8-6,14-10-8-7,14-11-8-7,15-11-8-7,15-11-10-8,16-12-10-8,16-12-10-8,20",
  "18-10-8-10,18-10-8-10,18-10-8-10,20-10-8-10,20-11-9-10,20-11-9-10,22-11-9-10,22-11-9-10,22-12-10-10,24-12-10-14,24-12-10-14,24-12-10-14,26-13-11-14,26-13-11-14,26-13-11-14,28-13-11-14,28-14-12-14,28-14-12-14,30"]},
 {id:"sit",name:"Abdominales",en:"Sit-ups",L:[
  "2-3-3-2-3-2,3-2-3-3-2-2,4-4-3-3-2-2,6-5-4-3-2-2,10-8-6-4-4-4,12-10-6-6-4-4,14-10-8-6-6-4,16-12-8-8-6-6,20",
  "18-16-12-10-8-8,20-16-14-12-10-8,24-16-14-12-12-10,28-18-16-12-12-10,28-18-16-14-12-10,32-18-16-14-14-12,36-20-18-14-14-12,36-20-18-16-14-12,38-20-18-16-16-14,42-20-18-16-16-14,42-22-20-16-16-14,44-22-20-18-16-14,44-22-20-18-18-16,46-22-20-18-18-16,46-24-22-18-18-16,48-24-22-20-18-16,48-24-22-20-20-18,60",
  "60-30-22-20-20-18,62-30-24-22-20-18,64-30-24-22-20-18,66-32-24-22-20-18,68-32-26-22-22-18,70-32-26-24-22-20,72-34-26-24-22-20,74-34-28-24-22-20,76-34-28-24-24-20,78-36-28-26-24-20,80-36-30-26-24-22,82-36-30-26-24-22,84-38-30-26-26-22,86-38-32-28-26-22,88-38-32-28-26-22,90-40-32-28-26-24,92-40-34-28-28-24,100"]},
 {id:"squat",name:"Sentadillas",en:"Squats",L:[
  "4-3-3-2,5-4-3-3,6-5-5-3,7-6-5-4,10-8-6-5,13-9-6-5,15-10-8-5,17-10-8-6,20",
  "20-16-14-15,24-16-15-16,28-16-16-18,32-18-14-22,36-18-15-24,40-18-16-26,44-20-14-30,48-20-15-32,52-20-16-34,56-22-14-38,60-22-15-40,64-22-16-42,68-24-14-46,72-24-15-48,76-24-16-50,80-26-14-54,84-26-15-56,88-26-16-58,100",
  "80-30-20-48,85-30-20-52,90-32-20-56,95-32-22-60,100-34-22-62,105-34-22-64,110-36-24-66,115-36-24-66,120-37-24-66,123-38-26-67,126-39-26-67,129-40-26-67,132-41-28-68,135-42-28-68,138-43-28-68,141-44-30-69,142-45-30-69,143-46-30-69,150"]}
];
EX.forEach(e=>e.L=e.L.map(l=>l.split(",").map(d=>d.split("-").map(Number))));
const SHORT={push:"Flex",pull:"Dom",sit:"Abd",squat:"Sent"};
const DAYS=["L","M","X","J","V","S","D"],DAYN=["Lunes","Martes","Miércoles","Jueves","Viernes","Sábado","Domingo"];
const SCH=[
 {name:"Empuje + piernas / Tirón + core",A:["push","squat"],B:["pull","sit"]},
 {name:"Tren superior / Core + piernas",A:["push","pull"],B:["sit","squat"]}];
const pairFor=(wd)=>{const s=SCH[S.sch||0];return wd===6?[]:(wd%2===0?s.A:s.B)};
const todayStr=()=>{const t=new Date();return t.getFullYear()+"-"+(t.getMonth()+1)+"-"+t.getDate()};
const todayWd=()=>(new Date().getDay()+6)%7;
const sum=a=>a.reduce((x,y)=>x+y,0);

const KEY="plan-entreno-v1";
let S;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.p){S={ex:"push",rest:60,p:{}};}
if(S.sch==null)S.sch=0;
let selWd=todayWd();{const pr=pairFor(selWd);if(pr.length)S.ex=pr[0];}
EX.forEach(e=>{if(!S.p[e.id])S.p[e.id]={lv:0,done:{},tests:{},sel:null,sets:{}}});
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};

const $=id=>document.getElementById(id);
const ex=()=>EX.find(e=>e.id===S.ex);
const P=()=>S.p[S.ex];
const k=(lv,d)=>lv+"-"+d;
function curDay(id){
  const e=id?EX.find(x=>x.id===id):ex(),p=id?S.p[id]:P(),days=e.L[p.lv];
  if(p.sel!=null&&p.sel<days.length)return p.sel;
  const i=days.findIndex((_,d)=>!p.done[k(p.lv,d)]);
  return i<0?days.length-1:i;
}
let timerEnd=0,timerInt=null,confirmReset=false;

function render(){
  const e=ex(),p=P(),days=e.L[p.lv],d=curDay(),reps=days[d],isTest=reps.length===1,key=k(p.lv,d);
  // week
  const tw=todayWd(),pr=pairFor(selWd);
  let w=`<div class="foot"><span class="lbl">Plan semanal</span><span class="lbl">${DAYN[selWd]}${selWd===tw?" · hoy":""}</span></div>
   <div class="wk">${DAYS.map((L,i)=>{const pp=pairFor(i);return `<button class="wd ${i===tw?"today":""} ${pp.length?"":"off"}" aria-pressed="${i===selWd}" data-wd="${i}"><b>${L}</b><span>${pp.length?pp.map(x=>SHORT[x]).join("<br>"):"Descanso"}</span></button>`}).join("")}</div>`;
  if(pr.length){
    w+=`<div class="pair">${pr.map(id=>{const x=EX.find(y=>y.id===id),q=S.p[id],dd=curDay(id),r=x.L[q.lv][dd],ok=q.last===todayStr()&&selWd===tw;
      return `<button class="pe ${ok?"ok":""}" aria-current="${id===S.ex}" data-ex="${id}"><small>${ok?"✓ Hecho hoy":"Nivel "+(q.lv+1)+" · día "+(dd+1)}</small><b>${x.name}</b><span class="n">${r.length===1?"máx "+r[0]:sum(r)} <small>reps</small></span></button>`}).join("")}</div>`;
  }else w+=`<p class="hint">Día de descanso. Los músculos crecen mientras recuperan.</p>`;
  w+=`<div class="sch"><span class="lbl">Combinación</span>${SCH.map((c,i)=>`<button aria-pressed="${i===S.sch}" data-sch="${i}">${c.name}</button>`).join("")}</div>`;
  $("week").innerHTML=w;
  // tabs
  $("tabs").innerHTML=EX.map(x=>{
    const q=S.p[x.id];const n=Object.keys(q.done).length,t=sum(x.L.map(l=>l.length));
    return `<button class="tab" role="tab" aria-selected="${x.id===S.ex}" data-ex="${x.id}"><b>${x.name}</b>${pr.includes(x.id)?`<span class="hoy">${selWd===tw?"Hoy":DAYS[selWd]}</span>`:`<span>${n}/${t} días</span>`}</button>`}).join("");
  // levels
  $("levels").innerHTML=e.L.map((l,i)=>{
    const n=l.filter((_,dd)=>p.done[k(i,dd)]).length;
    return `<button class="lv" aria-pressed="${i===p.lv}" data-lv="${i}"><b>Nivel ${i+1}</b><small>${n}/${l.length} días</small><div class="bar"><i style="width:${n/l.length*100}%"></i></div></button>`}).join("");
  // today
  const doneDay=!!p.done[key];
  const sd=p.sets[key]||0;
  const t=$("today");t.className="today"+(isTest?" is-test":"");
  let h=`<div class="head"><div><div class="lbl">${e.name} · Nivel ${p.lv+1}</div><div class="day">Día ${d+1}<small> / ${days.length}</small></div></div>
    <div class="total"><div class="lbl">Total</div><b>${sum(reps)}</b></div></div>`;
  if(doneDay){
    h+=`<div><span class="pill ok">Completado</span>${isTest&&p.tests[key]!=null?` <span class="hint" style="display:inline">· hiciste ${p.tests[key]} reps</span>`:""}</div>`;
    const next=d+1<days.length;
    h+=`<div class="row">${next?`<button class="primary" data-act="next">Ir al día ${d+2}</button>`:(p.lv<2?`<button class="primary" data-act="uplv">Pasar al nivel ${p.lv+2}</button>`:"")}<button class="ghost" data-act="undo">Desmarcar día</button></div>`;
  }else if(isTest){
    h+=`<div><span class="pill">Prueba de máximo</span></div>
      <p class="hint" style="margin:0">Haz el máximo de repeticiones seguidas que puedas. Objetivo: <b>${reps[0]}</b>.</p>
      <div class="maxin"><input id="maxInput" type="number" inputmode="numeric" min="0" placeholder="Reps hechas" aria-label="Repeticiones hechas"><button class="primary test" style="width:auto" data-act="test">Guardar</button></div>`;
  }else{
    h+=`<div class="sets">${reps.map((r,i)=>`<button class="set ${i<sd?"done":i===sd?"next":""}" data-set="${i}" aria-label="Serie ${i+1}: ${r} repeticiones">${r}</button>`).join("")}</div>`;
    h+=`<div id="timerBox"></div>`;
    h+= sd>=reps.length?`<button class="primary" data-act="finish">Completar día ${d+1}</button>`:`<p class="hint">Serie ${sd+1} de ${reps.length}. Tócala cuando la termines para empezar el descanso.</p>`;
  }
  t.innerHTML=h;
  renderTimer();
  // grid
  $("gridLbl").textContent=`Días del nivel ${p.lv+1}`;
  const n=days.filter((_,dd)=>p.done[k(p.lv,dd)]).length;
  $("gridSum").textContent=`${sum(days.filter((_,dd)=>p.done[k(p.lv,dd)]).map(sum))} reps hechas`;
  $("grid").innerHTML=days.map((r,i)=>`<button class="d ${p.done[k(p.lv,i)]?"done":""} ${r.length===1?"tst":""}" data-day="${i}" aria-current="${i===d}"><b>${p.done[k(p.lv,i)]?"✓ ":""}${i+1}</b><span>${r.length===1?"máx "+r[0]:sum(r)}</span></button>`).join("");
  // rest
  $("rest").innerHTML=`<span class="lbl">Descanso</span>`+[30,60,90,120].map(s=>`<button aria-pressed="${S.rest===s}" data-rest="${s}">${s}s</button>`).join("");
  $("resetBox").innerHTML=confirmReset?`<div class="confirm">¿Borrar ${e.name.toLowerCase()}? <button class="danger" data-act="doreset">Borrar</button><button class="ghost" data-act="noreset">No</button></div>`:`<button class="ghost" data-act="reset">Reiniciar ${e.name.toLowerCase()}</button>`;
}

function renderTimer(){
  const box=$("timerBox");if(!box)return;
  const left=Math.ceil((timerEnd-Date.now())/1000);
  if(left>0){box.innerHTML=`<div class="timer"><b>${Math.floor(left/60)}:${String(left%60).padStart(2,"0")}</b><span class="grow">Descansa antes de la siguiente serie</span><button class="ghost" data-act="skip">Saltar</button></div>`}
  else box.innerHTML="";
}
let actx;
function beep(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();[0,.25].forEach(o=>{const g=actx.createGain(),os=actx.createOscillator();os.frequency.value=880;os.connect(g);g.connect(actx.destination);g.gain.setValueAtTime(.25,actx.currentTime+o);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+o+.2);os.start(actx.currentTime+o);os.stop(actx.currentTime+o+.2)})}catch(e){}try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}
function startTimer(){
  timerEnd=Date.now()+S.rest*1000;clearInterval(timerInt);
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();actx.resume&&actx.resume()}catch(e){}
  timerInt=setInterval(()=>{if(Date.now()>=timerEnd){clearInterval(timerInt);beep()}renderTimer()},250);
}
function stopTimer(){timerEnd=0;clearInterval(timerInt);}

document.addEventListener("click",ev=>{
  const b=ev.target.closest("button");if(!b)return;
  const p=P(),e=ex(),d=curDay(),key=k(p.lv,d);
  if(b.dataset.wd!=null){selWd=+b.dataset.wd;const pp=pairFor(selWd);if(pp.length&&!pp.includes(S.ex))S.ex=pp[0];stopTimer();}
  else if(b.dataset.sch!=null){S.sch=+b.dataset.sch;const pp=pairFor(selWd);if(pp.length)S.ex=pp[0];}
  else if(b.dataset.ex){S.ex=b.dataset.ex;confirmReset=false;stopTimer();}
  else if(b.dataset.lv!=null){p.lv=+b.dataset.lv;p.sel=null;stopTimer();}
  else if(b.dataset.day!=null){p.sel=+b.dataset.day;stopTimer();}
  else if(b.dataset.rest){S.rest=+b.dataset.rest;}
  else if(b.dataset.set!=null){
    const i=+b.dataset.set,sd=p.sets[key]||0,len=e.L[p.lv][d].length;
    if(i<sd){p.sets[key]=i;stopTimer();}else{p.sets[key]=i+1;if(i+1<len)startTimer();else stopTimer();}
  }else switch(b.dataset.act){
    case "finish":p.done[key]=true;p.last=todayStr();delete p.sets[key];p.sel=d;stopTimer();break;
    case "next":p.sel=d+1;break;
    case "uplv":p.lv++;p.sel=null;break;
    case "undo":delete p.done[key];if(p.last===todayStr())delete p.last;delete p.tests[key];p.sel=d;break;
    case "skip":stopTimer();break;
    case "test":{const v=parseInt($("maxInput").value,10);if(isNaN(v)){$("maxInput").focus();return}p.tests[key]=v;p.done[key]=true;p.last=todayStr();p.sel=d;break}
    case "reset":confirmReset=true;break;
    case "noreset":confirmReset=false;break;
    case "doreset":S.p[S.ex]={lv:0,done:{},tests:{},sel:null,sets:{}};confirmReset=false;stopTimer();break;
  }
  if(b.dataset.act==="finish"||b.dataset.act==="test"){const pp=pairFor(todayWd()),o=pp.find(x=>x!==S.ex&&S.p[x].last!==todayStr());if(pp.includes(S.ex)&&o){S.ex=o;window.scrollTo({top:0,behavior:"smooth"})}}
  save();render();
});
render();
if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(()=>{})}
</script>
